name: Sync upstream

on:
  schedule:
    # 每天 10:23 北京时间（02:23 UTC），避开整点高峰
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream and push
        run: |
          set -euo pipefail
          git config user.name "sync-bot"
          git config user.email "actions@github.com"
          git remote add upstream https://github.com/sou350121/VLA-Handbook.git
          git fetch upstream main

          OLD_SHA=$(git rev-parse HEAD)

          if ! git merge upstream/main --no-edit; then
            echo "::error::merge conflict — fork main 与 upstream main 分叉，需要手动解决"
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" = "$OLD_SHA" ]; then
            echo "✅ Already up to date — upstream 没有新提交"
            echo "SYNCED=false" >> "$GITHUB_ENV"
          else
            git push origin main
            COUNT=$(git rev-list --count "$OLD_SHA"..upstream/main --no-merges)
            echo "✅ Synced: $COUNT new commit(s) merged"
            echo "SYNCED=true" >> "$GITHUB_ENV"
            echo "OLD_SHA=$OLD_SHA" >> "$GITHUB_ENV"
            echo "COUNT=$COUNT" >> "$GITHUB_ENV"
          fi

      # 有新提交 → 发当日摘要；手动触发且无新提交 → 发测试消息（用于验证 webhook 配置）
      - name: Notify DingTalk with daily digest
        if: env.SYNCED == 'true' || github.event_name == 'workflow_dispatch'
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          set -euo pipefail
          : "${DINGTALK_WEBHOOK:?需要在仓库 Secrets 里配置 DINGTALK_WEBHOOK}"

          # 钉钉机器人若开启「加签」，用 HMAC-SHA256 计算签名
          if [ -n "${DINGTALK_SECRET:-}" ]; then
            ts=$(date +%s%3N)
            sign=$(printf '%s\n%s' "$ts" "$DINGTALK_SECRET" \
                   | openssl dgst -sha256 -hmac "$DINGTALK_SECRET" -binary \
                   | base64 | jq -sRr @uri)
            DINGTALK_WEBHOOK="${DINGTALK_WEBHOOK}&timestamp=${ts}&sign=${sign}"
          fi

          if [ "${SYNCED:-false}" = "true" ]; then
            {
              echo "## 📚 VLA-Handbook 每日更新"
              echo ""
              echo "**$(date +%F) · 新增 ${COUNT} 个提交**"
              echo ""
              git log "${OLD_SHA}"..upstream/main --no-merges --pretty=format:'- %s' | head -25
              if [ "$COUNT" -gt 25 ]; then
                echo ""
                echo "……及其余 $((COUNT-25)) 条，见仓库"
              fi
              echo ""
              echo "[查看仓库](https://github.com/shawxiaodahua/VLA-Handbook)"
            } > body.md
          else
            {
              echo "## 📚 VLA-Handbook 同步测试"
              echo ""
              echo "当前与上游完全同步，暂无新提交。"
              echo "此条为手动触发的测试消息 —— 收到它说明钉钉通知配置成功 ✅"
            } > body.md
          fi

          jq -n --rawfile text body.md \
            '{msgtype:"markdown",markdown:{title:"VLA-Handbook 每日更新",text:$text}}' \
            | curl -sS -w '\n%{http_code}' -X POST -H 'Content-Type: application/json' -d @- "$DINGTALK_WEBHOOK" > resp.txt

          http_code=$(tail -1 resp.txt)
          resp_body=$(head -n -1 resp.txt)
          echo "DingTalk HTTP $http_code, response: $resp_body"

          if [ "$http_code" != "200" ] || [ "$(echo "$resp_body" | jq -r '.errcode // 1')" != "0" ]; then
            echo "::error::钉钉推送失败: $resp_body（常见: 310000=加签不匹配/关键词不在内容中, token 无效等）"
            exit 1
          fi
          echo "✅ DingTalk notified"

      - name: Notify DingTalk on failure
        if: failure()
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          set -euo pipefail
          : "${DINGTALK_WEBHOOK:-}" && [ -n "$DINGTALK_WEBHOOK" ] || { echo "no webhook, skip"; exit 0; }
          if [ -n "${DINGTALK_SECRET:-}" ]; then
            ts=$(date +%s%3N)
            sign=$(printf '%s\n%s' "$ts" "$DINGTALK_SECRET" \
                   | openssl dgst -sha256 -hmac "$DINGTALK_SECRET" -binary \
                   | base64 | jq -sRr @uri)
            DINGTALK_WEBHOOK="${DINGTALK_WEBHOOK}&timestamp=${ts}&sign=${sign}"
          fi
          jq -n '{msgtype:"text",text:{content:"❌ VLA-Handbook 同步 workflow 失败，请检查: https://github.com/shawxiaodahua/VLA-Handbook/actions"}}' \
            | curl -sS -X POST -H 'Content-Type: application/json' -d @- "$DINGTALK_WEBHOOK" | jq .
